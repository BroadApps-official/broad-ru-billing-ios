name: Module quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  module-gate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Run full standalone module gate
        run: bash Scripts/module_gate.sh
      - name: Package DocC archive
        if: github.ref == 'refs/heads/main'
        run: |
          for module in BroadRUBilling BroadRUBillingUI; do
            ditto -c -k --sequesterRsrc --keepParent \
              ".build/DerivedData/Build/Products/Debug-iphonesimulator/$module.doccarchive" \
              ".build/$module.doccarchive.zip"
          done
      - name: Upload DocC archive
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: BroadRUBilling-docc
          path: .build/BroadRUBilling*.doccarchive.zip
          include-hidden-files: true
          if-no-files-found: error
